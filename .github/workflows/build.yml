name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run typecheck

  build:
    needs: typecheck
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build
      # Packaging (dist:mac / dist:win) and GitHub Releases publishing are
      # wired up in electron-builder's config (see package.json "build" /
      # "publish"), but left out of CI until code signing secrets exist —
      # see PROJECT_STATUS.md "Known Issues" for what's still needed.
